name: "CI - Main (Production)"

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build, Test, Scan & Push to DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Build & Test with Maven
        run: mvn clean install

      - name: Build Docker Image
        run: docker build -t java-ci-demo:${{ github.sha }} .

      - name: Scan Docker Image (Critical CVEs)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'java-ci-demo:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag & Push Image (latest + SHA)
        run: |
          docker tag java-ci-demo:${{ github.sha }} shripadshet/java-ci-demo:latest
          docker tag java-ci-demo:${{ github.sha }} shripadshet/java-ci-demo:${{ github.sha }}
          docker push shripadshet/java-ci-demo:latest
          docker push shripadshet/java-ci-demo:${{ github.sha }}
